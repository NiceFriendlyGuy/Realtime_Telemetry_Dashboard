name: proxy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    mem_limit: 64m

networks:
  proxy:
    name: proxy

volumes:
  caddy_data:
  caddy_config: