server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS, resolved per request. If only the backend container is
  # recreated on a deploy, nginx finds its new address without a restart.
  resolver 127.0.0.11 valid=10s;
  set $backend http://backend:3000;

  location /api/ {
    proxy_pass $backend;
  }

  location /ws {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}